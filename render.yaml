services:
  - type: web
    name: trademark-conflict-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trademark-postgres
          property: connectionString
      - key: API_CORS_ORIGINS
        value: "https://your-frontend.vercel.app,http://localhost:5173"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: trademark-postgres
    plan: free
    region: oregon
    postgresMajorVersion: 16
